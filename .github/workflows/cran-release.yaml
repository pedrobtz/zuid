# Committing CRAN-SUBMISSION (written by devtools::submit_cran()) tags the
# submitted commit, creates the release and opens the .9000 bump.
on:
  push:
    branches: [main]
    paths: [CRAN-SUBMISSION]

name: cran-release

permissions:
  contents: write
  pull-requests: write

jobs:
  cran-release:
    uses: pedrobtz/r-actions/.github/workflows/cran-release.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
