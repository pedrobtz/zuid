on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "32 6 * * 0"
  workflow_dispatch:
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # The one r-actions call holding a write token, so it is pinned to a
    # commit rather than the mutable v1 tag, and bumped by reading the diff.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1.23.0
    permissions:
      contents: write
    with:
      # main takes changes through pull requests only, so the badge commit
      # goes to gh-pages, which the pkgdown deploy already writes to.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
