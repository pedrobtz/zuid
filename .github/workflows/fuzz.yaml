on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # A long run nightly. The corpus cache is what makes the short PR runs
    # and this one add up to a single campaign.
    - cron: "0 3 * * *"

name: fuzz

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fuzz:
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tools/fuzz/harness.c
      sources: src/*.c
      # The R-facing half of src/: it needs R's headers and is not a codec.
      exclude-sources: |
        src/zuid_r.c
        src/zuid_r_*.c
        src/zuid_init.c
      cflags: -g -O1 -fno-omit-frame-pointer -Isrc -DZUID_STANDALONE
      seed-corpus: tools/fuzz/corpus
      dictionary: tools/fuzz/zuid.dict
      # An hour nightly and on a pull request labelled full-ci (design.md
      # section 12); two minutes on the others.
      max-total-time: ${{ (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 3600 || 120 }}
      timeout-minutes: 75
